# yaml file path defined in kumi.xacro (effort_control.xacro)
---
controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      update_rate: 10
    wheel_group_effort_controller:
      type: effort_controllers/JointGroupEffortController
      update_rate: 100
    wheel_group_trajectory_controller:
      type: joint_trajectory_controller/JointGroupTrajectoryController
      update_rate: 100

wheel_group_effort_controller:
  ros__parameters:
    joints:
    - rear_right_wheel_spin
    - rear_left_wheel_spin
    state_interfaces:
    - position
    - velocity
    - effort
    command_interfaces:
    - effort

wheel_group_trajectory_controller:
  ros__parameters:
    joints:
    - front_right_steer
    - front_left_steer
    state_interfaces:
    - position
    - velocity
    command_interfaces:
    - position
